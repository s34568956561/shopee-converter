<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>蝦皮連結轉換器測試</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans TC', sans-serif;
      background: linear-gradient(to bottom, #f4ece6, #efe4dc);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #6e5c52;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: rgba(255,255,255,0.75);
      backdrop-filter: blur(12px);
      border-radius: 28px;
      padding: 32px 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    .title {
      text-align: center;
      font-size: 30px;
      font-weight: 700;
      margin-bottom: 10px;
      color: #7c675d;
    }

    .subtitle {
      text-align: center;
      font-size: 15px;
      line-height: 1.8;
      margin-bottom: 28px;
      color: #9c877d;
    }

    textarea {
      width: 100%;
      height: 140px;
      border: none;
      border-radius: 18px;
      padding: 18px;
      resize: none;
      font-size: 15px;
      outline: none;
      background: #fffaf7;
      color: #6e5c52;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.04);
    }

    textarea::placeholder {
      color: #c2ada1;
    }

    .btn {
      width: 100%;
      margin-top: 18px;
      border: none;
      padding: 16px;
      border-radius: 18px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .convert-btn {
      background: #b89f91;
      color: white;
    }

    .convert-btn:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    .copy-btn {
      background: #d8c1b5;
      color: white;
      display: none;
    }

    .open-btn {
      background: #c7b0a2;
      color: white;
      display: none;
    }

    .result-box {
      margin-top: 24px;
      background: #fffaf7;
      border-radius: 18px;
      padding: 18px;
      word-break: break-all;
      display: none;
    }

    .label {
      font-size: 13px;
      margin-bottom: 8px;
      color: #a58e82;
    }

    .link {
      font-size: 14px;
      line-height: 1.8;
    }

    .footer {
      margin-top: 24px;
      text-align: center;
      font-size: 12px;
      color: #b39d91;
      line-height: 1.8;
    }

    .success {
      margin-top: 12px;
      text-align: center;
      font-size: 14px;
      color: #8d7468;
      display: none;
    }

    @media (max-width: 480px) {
      .card {
        padding: 26px 18px;
      }

      .title {
        font-size: 26px;
      }
    }
  </style>
</head>
<body>

  <div class="card">

    <div class="title">蝦皮連結轉換器-測試7</div>

    <div class="subtitle">
      貼上蝦皮商品連結<br>
      自動轉換成專屬導購連結
    </div>

    <textarea
      id="input"
      placeholder="請貼上蝦皮商品網址\n例如：https://shopee.tw/..."
    ></textarea>

    <button class="btn convert-btn" onclick="convertLink()">
      立即轉換
    </button>

    <div class="result-box" id="resultBox">
      <div class="label">轉換完成：</div>
      <div class="link" id="result"></div>
    </div>

    <button class="btn copy-btn" id="copyBtn" onclick="copyLink()">
      一鍵複製連結
    </button>

    <button class="btn open-btn" id="openBtn" onclick="openShopee()">
      開啟蝦皮 APP
    </button>

    <div class="success" id="successText">
      已成功複製連結 ✨
    </div>

    <div class="footer">
      Morandi Beige Style<br>
      Shopee Affiliate Converter
    </div>

  </div>

<script>

const promoCode = 'AWM-SXH-LTA';

let finalUrl = '';

function convertLink() {

  const input = document.getElementById('input').value.trim();

  if (!input) {

    alert('請先貼上蝦皮商品連結');
    return;

  }

  try {

    const url = new URL(input);

    // 加入推廣碼
    url.searchParams.set(
      'smtt',
      promoCode
    );

    finalUrl = url.toString();

    // 顯示結果
    document.getElementById('result').innerHTML = `
      <a href="${finalUrl}" target="_blank">
        ${finalUrl}
      </a>
    `;

    // 顯示按鈕
    document.getElementById('resultBox').style.display = 'block';
    document.getElementById('copyBtn').style.display = 'block';
    document.getElementById('openBtn').style.display = 'block';

    // 自動跳轉
    setTimeout(() => {

      window.location.href = finalUrl;

    }, 800);

  } catch (err) {

    alert('網址格式錯誤');

  }

}

// 一鍵複製
async function copyLink() {

  try {

    await navigator.clipboard.writeText(finalUrl);

    document.getElementById('successText').style.display = 'block';

    setTimeout(() => {

      document.getElementById('successText').style.display = 'none';

    }, 1800);

  } catch (err) {

    alert('複製失敗');

  }

}

// 開啟蝦皮
function openShopee() {

  if (!finalUrl) {

    alert('請先轉換連結');
    return;

  }

  window.location.href = finalUrl;

}

</script>
</body>
</html>
